name: Daily vacancy discovery

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Search public indexed vacancy results
        run: python scripts/search_vacancies.py
      - name: Commit updated discovery feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vacancies-feed.json
          if git diff --cached --quiet; then
            echo "No feed changes to commit."
          else
            git commit -m "Refresh daily vacancy discovery feed"
            git push
          fi
